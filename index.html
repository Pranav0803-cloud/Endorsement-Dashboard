function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cbName = "jsonp_cb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let done = false;
    const timer = setTimeout(() => {
      if (!done) {
        done = true;
        // Leave a harmless no-op in place instead of deleting it — if the
        // response is just slow (not actually broken) and arrives after
        // this timeout, it calls into this stub instead of throwing a
        // ReferenceError in the console.
        window[cbName] = () => {};
        script.remove();
        reject(new Error("Request timed out — the sheet may be slow to respond right now. Try refresh again in a moment."));
      }
    }, 45000);
    function cleanup() {
      delete window[cbName];
      script.remove();
      clearTimeout(timer);
    }
    window[cbName] = (data) => {
      if (done) return;
      done = true;
      cleanup();
      resolve(data);
    };
    script.onerror = () => {
      if (!done) {
        done = true;
        cleanup();
        reject(new Error("Failed to load — double check the Apps Script URL."));
      }
    };
    script.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + cbName;
    document.body.appendChild(script);
  });
}

}
